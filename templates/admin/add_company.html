<!DOCTYPE html>
<html>

<head>

<title>Add Company</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-xl shadow">

<h1 class="text-3xl font-bold mb-6">

Add Placement Company

</h1>

<form method="POST"
      enctype="multipart/form-data">

    <label class="font-semibold">

        Company Name

    </label>

    <input
        type="text"
        name="company"
        required
        class="w-full border p-3 rounded mt-2 mb-5">

    <label class="font-semibold">

        Company Logo

    </label>

    <input
        type="file"
        name="photo"
        required
        class="w-full border p-3 rounded mt-2 mb-5">

    <button
        class="bg-indigo-600 text-white px-6 py-3 rounded">

        Save Company

    </button>

</form>

</div>

</body>
</html>
