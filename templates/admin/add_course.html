<!DOCTYPE html>
<html>
<head>
    <title>Add Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- ================= SIDEBAR ================= -->

    <aside class="w-64 bg-gray-900 text-white">

        <div class="text-center py-6 border-b border-gray-700">

            <h1 class="text-2xl font-bold">

                RR Institute

            </h1>

            <p class="text-gray-400 mt-2">

                Admin Panel

            </p>

        </div>

        <nav class="mt-6">

            <a href="{{ url_for('admin.dashboard') }}"
               class="block px-6 py-3 hover:bg-gray-800">

                🏠 Dashboard

            </a>

            <a href="{{ url_for('admin.students') }}"
               class="block px-6 py-3 hover:bg-gray-800">

                👨‍🎓 Students

            </a>

            <a href="{{ url_for('admin.courses') }}"
               class="block px-6 py-3 bg-blue-600">

                📚 Courses

            </a>

            <a href="{{ url_for('admin.companies') }}"
               class="block px-6 py-3 hover:bg-gray-800">

                🏢 Companies

            </a>

            <a href="{{ url_for('admin.placements') }}"
               class="block px-6 py-3 hover:bg-gray-800">

                💼 Placements

            </a>

            <a href="{{ url_for('admin.faculty') }}"
               class="block px-6 py-3 hover:bg-gray-800">

                👨‍🏫 Faculty

            </a>

            <a href="{{ url_for('admin.batches') }}"
               class="block px-6 py-3 hover:bg-gray-800">

                📅 Batches

            </a>

            <a href="{{ url_for('auth.logout') }}"
               class="block px-6 py-3 text-red-300 hover:bg-red-700">

                🚪 Logout

            </a>

        </nav>

    </aside>

    <!-- ================= MAIN CONTENT ================= -->

    <div class="flex-1">

        <div class="bg-white shadow px-8 py-5 flex justify-between items-center">

            <div>

                <h1 class="text-3xl font-bold">

                    Add New Course

                </h1>

                <p class="text-gray-500 mt-1">

                    Create a new course for RR Institute.

                </p>

            </div>

            <a href="{{ url_for('admin.courses') }}"
               class="bg-gray-700 hover:bg-gray-800 text-white px-6 py-3 rounded-lg">

                ← Back to Courses

            </a>

        </div>

        <div class="p-8">

           <form method="POST" enctype="multipart/form-data">

                <div class="bg-white rounded-xl shadow">

                    <div class="border-b px-6 py-4">

                        <h2 class="text-2xl font-bold text-indigo-600">

                            📚 Course Information

                        </h2>

                    </div>

                    <div class="grid md:grid-cols-2 gap-6 p-6">

                        <!-- Course Title -->

                        <div>

                            <label class="font-semibold">

                                Course Title *

                            </label>

                            <input
                            type="text"
                            name="title"
                            placeholder="Python Full Stack"
                            class="w-full border rounded-lg px-4 py-3 mt-2"
                            required>

                        </div>

                        <!-- Duration -->

                        <div>

                            <label class="font-semibold">

                                Duration

                            </label>

                            <input
                            type="text"
                            name="duration"
                            placeholder="6 Months"
                            class="w-full border rounded-lg px-4 py-3 mt-2">

                        </div>

                        <!-- Trainer -->

                        <div>

                            <label class="font-semibold">

                                Trainer

                            </label>

                            <input
                            type="text"
                            name="trainer"
                            placeholder="Trainer Name"
                            class="w-full border rounded-lg px-4 py-3 mt-2">

                        </div>

                        <!-- Course Mode -->

                        <div>

                            <label class="font-semibold">

                                Course Mode

                            </label>

                            <select
                            name="mode"
                            class="w-full border rounded-lg px-4 py-3 mt-2">

                                <option>

                                    Online

                                </option>

                                <option>

                                    Offline

                                </option>

                                <option>

                                    Hybrid

                                </option>

                            </select>

                        </div>

                        <!-- Price -->

                        <div>

                            <label class="font-semibold">

                                Course Fee

                            </label>

                            <input
                            type="number"
                            step="0.01"
                            name="price"
                            placeholder="25000"
                            class="w-full border rounded-lg px-4 py-3 mt-2">

                        </div>

                        <!-- Status -->

                       <!-- Featured -->

<div>

    <label class="font-semibold">

        Featured Course

    </label>

    <div class="mt-3">

        <label class="inline-flex items-center">

            <input
                type="checkbox"
                name="featured"
                value="1"
                class="mr-2">

            Show this course on Home Page

        </label>

    </div>

</div>

                        <!-- Description -->

                        <div class="md:col-span-2">

                            <label class="font-semibold">

                                Course Description

                            </label>

                            <textarea
                            rows="5"
                            name="description"
                            placeholder="Enter detailed course description..."
                            class="w-full border rounded-lg px-4 py-3 mt-2"
                            required></textarea>

                        </div>
                                                <!-- Course Image -->

                        <div>

                            <label class="font-semibold">

                                Course Image

                            </label>

                            <input
                            type="file"
                            name="image"
                            class="w-full border rounded-lg px-4 py-3 mt-2">

                        </div>

                    


                <!-- ================= BUTTONS ================= -->

                <div class="bg-white rounded-xl shadow p-6 mt-8">

                    <div class="flex justify-end gap-4">

                        <button
                        type="reset"
                        class="bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-3 rounded-lg">

                            🔄 Reset

                        </button>

                        <a
                        href="{{ url_for('admin.courses') }}"
                        class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-lg">

                            ❌ Cancel

                        </a>

                        <button
                        type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg font-semibold">

                            💾 Save Course

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
