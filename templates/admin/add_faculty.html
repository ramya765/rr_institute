<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Faculty | RR Institute</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="max-w-5xl mx-auto py-10">

    <div class="bg-white rounded-xl shadow p-8">

        <div class="flex justify-between items-center mb-8">

            <h1 class="text-3xl font-bold">
                👨‍🏫 Add Faculty
            </h1>

            <a href="{{ url_for('admin.faculty') }}"
               class="bg-gray-600 text-white px-5 py-2 rounded-lg hover:bg-gray-700">

                ← Back

            </a>

        </div>

        <form action="{{ url_for('admin.add_faculty') }}" method="POST">

            <div class="grid md:grid-cols-2 gap-6">

                <div>

                    <label class="block mb-2 font-medium">
                        Faculty Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        required
                        class="w-full border rounded-lg p-3">

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                        class="w-full border rounded-lg p-3">

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        required
                        class="w-full border rounded-lg p-3">

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Subject
                    </label>

                    <input
                        type="text"
                        name="subject"
                        required
                        class="w-full border rounded-lg p-3">

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Qualification
                    </label>

                    <input
                        type="text"
                        name="qualification"
                        class="w-full border rounded-lg p-3">

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Experience
                    </label>

                    <input
                        type="text"
                        name="experience"
                        placeholder="5 Years"
                        class="w-full border rounded-lg p-3">

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Batch
                    </label>

                    <select
                        name="batch"
                        class="w-full border rounded-lg p-3">

                        <option>Morning</option>
                        <option>Afternoon</option>
                        <option>Evening</option>
                        <option>Night</option>

                    </select>

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Monthly Payment
                    </label>

                    <input
                        type="number"
                        name="payment"
                        class="w-full border rounded-lg p-3">

                </div>

                <div>

                    <label class="block mb-2 font-medium">
                        Status
                    </label>

                    <select
                        name="status"
                        class="w-full border rounded-lg p-3">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>

            <div class="mt-6">

                <label class="block mb-2 font-medium">
                    Address
                </label>

                <textarea
                    name="address"
                    rows="4"
                    class="w-full border rounded-lg p-3"></textarea>

            </div>

            <div class="mt-8">

                <button
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg">

                    Save Faculty

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
