<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Add Placement</title>

<script src="https://cdn.tailwindcss.com"></script>


</head>



<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen">



<div class="max-w-3xl mx-auto py-12 px-5">


<div class="bg-white shadow-2xl rounded-3xl p-10">



<h1 class="text-4xl font-bold text-gray-800 mb-3">

Add Placement

</h1>



<p class="text-gray-500 mb-8">

Adding placement details for

<span class="font-bold text-indigo-600">

{{student.name}}

</span>


</p>






<form method="POST"

class="space-y-6">





<!-- COMPANY DROPDOWN -->


<div>


<label class="font-semibold text-gray-700">

Company Name

</label>



<select

name="company"

required

class="mt-2 w-full border border-gray-300 rounded-xl p-4">


<option value="">

Select Company

</option>



{% for company in companies %}


<option value="{{company.company}}">

{{company.company}}

</option>



{% endfor %}



</select>



</div>







<!-- DESIGNATION -->


<div>


<label class="font-semibold text-gray-700">

Designation

</label>


<input

type="text"

name="designation"

placeholder="Software Engineer"

required


class="mt-2 w-full border border-gray-300 rounded-xl p-4">


</div>








<!-- PACKAGE -->


<div>


<label class="font-semibold text-gray-700">

Package (LPA)

</label>



<input

type="number"

step="0.1"

name="package"

placeholder="4.5"

required


class="mt-2 w-full border border-gray-300 rounded-xl p-4">



</div>








<!-- DATE -->


<div>


<label class="font-semibold text-gray-700">

Placement Date

</label>



<input

type="date"

name="placement_date"

required


class="mt-2 w-full border border-gray-300 rounded-xl p-4">



</div>








<button

type="submit"


class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold py-4 rounded-xl shadow-lg">


Save Placement


</button>






</form>





</div>



</div>



</body>


</html>
