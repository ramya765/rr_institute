<!DOCTYPE html>
<html>

<head>

<title>Student Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100">


<nav class="bg-indigo-700 text-white px-8 py-5 flex justify-between">


<h1 class="text-2xl font-bold">

RR Institute

</h1>


<a href="{{ url_for('auth.logout') }}"
class="bg-red-500 px-4 py-2 rounded">

Logout

</a>


</nav>




<div class="p-8">


<h1 class="text-4xl font-bold">

Welcome Student

</h1>


<p class="text-gray-500 mt-2">

Learn industry skills and get placed.

</p>




<div class="grid md:grid-cols-3 gap-8 mt-10">


<div class="bg-white shadow rounded-xl p-6">


<h2 class="text-xl font-bold">

My Courses

</h2>


<p class="mt-3 text-gray-500">

View enrolled courses

</p>


<button class="mt-5 bg-indigo-600 text-white px-5 py-2 rounded">

View Courses

</button>


</div>





<div class="bg-white shadow rounded-xl p-6">


<h2 class="text-xl font-bold">

Available Courses

</h2>


<p class="mt-3 text-gray-500">

Explore new courses

</p>


<a href="/courses"
class="inline-block mt-5 bg-green-600 text-white px-5 py-2 rounded">

Explore

</a>


</div>





<div class="bg-white shadow rounded-xl p-6">


<h2 class="text-xl font-bold">

Profile

</h2>


<p class="mt-3 text-gray-500">

Manage your account

</p>


<button class="mt-5 bg-indigo-600 text-white px-5 py-2 rounded">

Profile

</button>


</div>



</div>


</div>


</body>

</html>
