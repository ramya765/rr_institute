<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RR IT Origin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body{
            font-family:'Inter',sans-serif;
            background:#f1f5f9;
        }

    </style>

</head>

<body>

<div class="min-h-screen flex">

    <!-- Sidebar -->

    <aside class="w-64 bg-gradient-to-b from-indigo-700 to-purple-800 text-white shadow-xl">

        <div class="p-6 border-b border-indigo-500">

            <h2 class="text-2xl font-bold">

                RR IT Origin

            </h2>

            <p class="text-indigo-200 mt-2">

                Student Portal

            </p>

        </div>

        <nav class="mt-6">

            <a href="{{ url_for('student.explorer_dashboard') }}"
               class="block px-6 py-3 hover:bg-indigo-600">

                🏠 Dashboard

            </a>

           <a href="{{ url_for('student.my_course') }}"
   class="block px-6 py-3 hover:bg-indigo-600">
    📘 My Course
</a>

            <a href="{{ url_for('student.fee_details') }}"
               class="block px-6 py-3 hover:bg-indigo-600">

                💰 Fee Details

            </a>

            <a href="{{ url_for('student.study_materials') }}"
               class="block px-6 py-3 hover:bg-indigo-600">

                📚 Study Materials

            </a>

            <a href="{{ url_for('student.placement') }}"
               class="block px-6 py-3 hover:bg-indigo-600">

                💼 Placement

            </a>

           <a href="{{ url_for('student.profile') }}"
   class="block px-6 py-3 hover:bg-indigo-600">

    👤 Profile

</a>

            <a href="{{ url_for('auth.logout') }}"
               class="block px-6 py-3 hover:bg-red-600">

                🚪 Logout

            </a>

        </nav>

    </aside>

    <!-- Main Content -->

    <main class="flex-1 p-8">

        {% block content %}

        {% endblock %}

    </main>

</div>

</body>

</html>
