{% extends "student/layout.html" %}

{% block content %}

<div class="bg-white rounded-xl shadow-lg p-8">

    <h1 class="text-3xl font-bold text-indigo-700 mb-8">
        📘 My Course
    </h1>

    <div class="grid md:grid-cols-2 gap-6">

        <div class="bg-indigo-50 rounded-xl p-6">
            <h3 class="text-gray-500">Course</h3>
            <p class="text-3xl font-bold text-indigo-700">
                {{ student.course }}
            </p>
        </div>

        <div class="bg-green-50 rounded-xl p-6">
            <h3 class="text-gray-500">Trainer</h3>
            <p class="text-3xl font-bold text-green-600">
                {{ student.trainer }}
            </p>
        </div>

        <div class="bg-purple-50 rounded-xl p-6">
            <h3 class="text-gray-500">Batch</h3>
            <p class="text-3xl font-bold text-purple-600">
                {{ student.batch }}
            </p>
        </div>

        <div class="bg-yellow-50 rounded-xl p-6">
            <h3 class="text-gray-500">Admission Date</h3>
            <p class="text-xl font-bold">
                {{ student.admission_date }}
            </p>
        </div>

    </div>

    <div class="mt-8">
        <a href="{{ url_for('student.explorer_dashboard') }}"
           class="bg-indigo-600 text-white px-6 py-3 rounded-lg">

            ← Back to Dashboard

        </a>
    </div>

</div>

{% endblock %}
